
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROVA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #020025;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .container img {
      width: 50px;
      height: auto;
      object-fit: contain;
    }

      .container h1 {
      margin-top: 16px;
      color: #c7d2fe;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .container p {
      margin-top: 8px;
      color: #a5b4fc;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .container iframe {
    margin-top: 24px;
    border: none;
    border-radius: 12px;
    opacity: 0.95;
  }

  .container a {
  display: inline-block;
  margin-top: 20px;
  color: #a5b4fc;
  font-size: 0.95rem;
  letter-spacing: 0.03em;
  text-decoration: none;
  border-bottom: 1px solid #a5b4fc55;
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
}

.container a:hover {
  color: #c7d2fe;
  border-color: #c7d2fe;
}
  </style>
</head>
<link rel="icon" type="image/png" href="rova icon 3.png">

<body>

  <canvas id="bg"></canvas>

<div class="container">
  <img src="rova icon 3.png" alt="Icon">
  <h1>ROVA</h1>
  <p>[The Future of Computer Vision]</p>
  <a href="https://agenticvision.substack.com/" target="_blank">subscribe to our substack</a>
</div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    let squares = [];
    const COUNT = 5;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function randomSquare(fromScratch) {
      const size = 8;
      const speed = 7;
      const opacity = 0.3;
      const rotation = 0.85
      const rotationSpeed = 0 

      let x, y;
      if (fromScratch) {
        x = Math.random() * (canvas.width + 200);
        y = Math.random() * canvas.height;
      } else {
        if (Math.random() < 0.5) {
          x = Math.random() * (canvas.width + 200);
          y = -size;
        } else {
          x = canvas.width + size;
          y = Math.random() * canvas.height;
        }
      }

      return { x, y, size, speed, opacity, rotation, rotationSpeed };
    }

    function init() {
      resize();
      squares = Array.from({ length: COUNT }, () => randomSquare(true));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const s of squares) {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.globalAlpha = s.opacity;
        ctx.fillStyle = '#818cf8';
        ctx.fillRect(-s.size / 2, -s.size / 2, s.size, s.size);
        ctx.restore();

        s.x -= s.speed;
        s.y += s.speed;
        s.rotation += s.rotationSpeed;

        if (s.x < -s.size * 2 || s.y > canvas.height + s.size * 2) {
          Object.assign(s, randomSquare(false));
        }
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);

    init();
    draw();
  </script>

</body>
</html>
